<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'quvchi Paneli</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-saminov">Saminov</span><span class="logo-school">School</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-link active"><i class="fa-solid fa-user"></i> <span data-i18n="student.profile">Mening profilim</span></a>
                <a href="#" class="nav-link logout-btn" onclick="logout(event)" data-i18n="nav.logout"><i class="fa-solid fa-right-from-bracket"></i> Chiqish</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="top-header">
                <div>
                    <p style="margin:0; color: rgba(255,255,255,0.72); font-size:0.95rem;">O'quvchi paneli</p>
                    <h2 id="welcomeText">Xush kelibsiz!</h2>
                    <p id="lastLoginText" style="font-size:0.95rem; color: rgba(255,255,255,0.72); margin-top:6px;"></p>
                </div>
            </header>
            
            <section class="content-section active-section glass-panel">
                <div class="section-header">
                    <h3 data-i18n="student.info">Ma'lumotlaringiz</h3>
                </div>

                <div class="stats-grid">
                    <article class="stat-panel">
                        <div class="stat-icon"><i class="fa-solid fa-user"></i></div>
                        <div>
                            <p>Sizning guruhingiz</p>
                            <strong id="statGroupName">—</strong>
                        </div>
                    </article>
                    <article class="stat-panel">
                        <div class="stat-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
                        <div>
                            <p>O'qituvchi</p>
                            <strong id="statTeacher">—</strong>
                        </div>
                    </article>
                    <article class="stat-panel">
                        <div class="stat-icon"><i class="fa-solid fa-credit-card"></i></div>
                        <div>
                            <p>To'lov holati</p>
                            <strong id="statPaymentStatus">—</strong>
                        </div>
                    </article>
                </div>

                <div class="glass-panel" style="margin: 20px 0; padding: 24px; border-radius: 20px;">
                    <h4 style="margin-bottom:12px; color: #ffffff;" data-i18n="student.details">Batafsil ma'lumot</h4>
                    <p style="margin-bottom: 10px;"><strong data-i18n="student.group_label">Guruh:</strong> <span id="studentGroupName"></span></p>
                    <p style="margin-bottom: 10px;"><strong data-i18n="student.teacher_label">O'qituvchi:</strong> <span id="studentTeacherName"></span></p>
                    <div style="margin-top:12px; padding: 18px; background: rgba(255,255,255,0.06); border-radius: 16px;">
                        <p style="font-size:1rem; margin: 0;"><strong data-i18n="student.payment_status">Joriy oylik to'lov holati:</strong> <span id="paymentStatusBadge" style="font-weight: 700; margin-left: 10px;"></span></p>
                        <p style="margin-top:8px;"><strong>To'lov summasi:</strong> <span id="paymentAmountText" style="font-weight:700; margin-left:8px;"></span></p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <script>
        function safeParseJSON(key, fallback = null) {
            const value = localStorage.getItem(key);
            if (!value) return fallback;
            try {
                return JSON.parse(value);
            } catch {
                return fallback;
            }
        }

        if (!window.logout) {
            window.logout = function(e) {
                if (e && typeof e.preventDefault === 'function') e.preventDefault();
                const currentUser = safeParseJSON('currentUser');
                if (currentUser) {
                    const db = safeParseJSON('schoolDB') || {};
                    if (!Array.isArray(db.loginHistory)) db.loginHistory = [];
                    db.loginHistory.unshift({
                        type: 'logout',
                        role: currentUser.role || 'user',
                        userId: currentUser.id || null,
                        name: currentUser.name || "Noma'lum",
                        phone: currentUser.phone || '',
                        timestamp: new Date().toISOString()
                    });
                    if (typeof window.pruneLoginHistory === 'function') {
                        window.pruneLoginHistory(db);
                    } else {
                        const maxAgeMs = 10 * 60 * 1000;
                        const cutoff = Date.now() - maxAgeMs;
                        db.loginHistory = db.loginHistory.filter(item => {
                            const time = new Date(item.timestamp).getTime();
                            return !Number.isNaN(time) && time >= cutoff;
                        });
                    }
                    localStorage.setItem('schoolDB', JSON.stringify(db));
                    localStorage.removeItem('currentUser');
                }
                window.location.href = 'login.html';
            };
        }
        document.addEventListener('DOMContentLoaded', () => {
            const db = safeParseJSON('schoolDB');
            const user = safeParseJSON('currentUser');
            if (!user || !db || user.role !== 'student') {
                window.location.href = 'login.html';
                return;
            }
            const getText = (key, fallback) => {
                return window.getTranslation ? window.getTranslation(key) : fallback;
            };

            document.getElementById('welcomeText').innerText = `${getText('student.welcome_prefix', "O'quvchi:")} ${user.name}`;
            const lastLoginText = document.getElementById('lastLoginText');
            if (lastLoginText && user.loginTime) {
                const loginDate = new Date(user.loginTime);
                lastLoginText.innerText = `So'nggi kirish: ${loginDate.toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
            }
            const currentStudent = db.students.find(s => s.id === user.id);
            const group = db.groups.find(g => g.id == currentStudent.groupId);
            let teacherName = getText('student.unassigned', 'Biriktirilmagan');
            if(group) {
                const teacher = db.teachers.find(t => t.id == group.teacherId);
                if(teacher) teacherName = teacher.name;
            }
            document.getElementById('studentGroupName').innerText = group ? group.name : getText('student.no_group', "Guruh yo'q");
            document.getElementById('studentTeacherName').innerText = teacherName;
            const badge = document.getElementById('paymentStatusBadge');
            if (currentStudent.payment) {
                badge.innerText = getText('student.payment_paid', "To'langan");
                badge.style.color = '#ef4444';
            } else {
                badge.innerText = getText('student.payment_due', "To'lanmagan (Qarzdorlik mavjud)");
                badge.style.color = '#f87171';
            }
            const amountEl = document.getElementById('paymentAmountText');
            if (amountEl) {
                amountEl.innerText = currentStudent && (currentStudent.paymentAmount || currentStudent.paymentAmount === 0) ? `${currentStudent.paymentAmount} so'm` : "0 so'm";
            }
        });
    </script>
    <script src="landing.js"></script>
</body>
</html>
